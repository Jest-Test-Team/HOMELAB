name: lab-analysis

# Analyse encrypted lab-evidence with Julia on a public runner, end-to-end encrypted.
# Trigger: the Mac pushes an encrypted blob to the evidence-inbox branch
# (lab/crypto/push-evidence.sh). Plaintext exists only in $RUNNER_TEMP during the
# job; the only thing uploaded is re-encrypted to the operator's archive public key.
on:
  push:
    branches: [evidence-inbox]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lab-analysis
  cancel-in-progress: false

jobs:
  analyse:
    # Only run in the operator's own repo; forks never get the secret anyway.
    if: github.repository_owner == 'Jest-Test-Team'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the triggering ref (evidence-inbox carries code + blob)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install age + zstd
        run: sudo apt-get update && sudo apt-get install -y age zstd

      - name: Install Julia 1.12.6 (pinned)
        run: |
          curl -fsSL https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.6-linux-x86_64.tar.gz -o /tmp/julia.tgz
          mkdir -p "$HOME/julia"
          tar -C "$HOME/julia" --strip-components=1 -xzf /tmp/julia.tgz
          echo "$HOME/julia/bin" >> "$GITHUB_PATH"

      - name: Decrypt evidence into a temp dir (never the checkout)
        id: decrypt
        env:
          LAB_ANALYSIS_KEY: ${{ secrets.LAB_ANALYSIS_KEY }}
        run: |
          set -Eeuo pipefail
          set +x
          WORK="$RUNNER_TEMP/work"; mkdir -p "$WORK/evidence" "$WORK/out"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          # The encrypted blob only exists on the evidence-inbox branch, put there by
          # lab/crypto/push-evidence.sh. A manual workflow_dispatch on another ref (e.g.
          # main), or an inbox with no fresh evidence, legitimately has nothing to
          # analyse — skip cleanly (green) instead of failing the run.
          if [ ! -f inbox/evidence.tar.zst.age ]; then
            echo "no inbox/evidence.tar.zst.age on this ref — nothing to analyse; skipping."
            echo "  activate the pipeline from the Mac with lab/crypto/push-evidence.sh,"
            echo "  which encrypts lab-evidence and pushes it to the evidence-inbox branch."
            echo "have=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Evidence is present, so the transport key is genuinely required now.
          # LAB_ANALYSIS_KEY is a registered secret, so GitHub auto-masks its value
          # in logs; set +x above keeps the key out of command traces too.
          [ -n "${LAB_ANALYSIS_KEY:-}" ] || { echo "evidence present but LAB_ANALYSIS_KEY secret not set"; exit 1; }
          ID="$RUNNER_TEMP/t.key"; umask 077
          printf '%s' "$LAB_ANALYSIS_KEY" > "$ID"
          age -d -i "$ID" inbox/evidence.tar.zst.age | zstd -dq | tar -C "$WORK/evidence" -xf -
          shred -u "$ID" 2>/dev/null || rm -f "$ID"
          echo "decrypted $(find "$WORK/evidence" -type f | wc -l) evidence file(s)"
          echo "have=1" >> "$GITHUB_OUTPUT"

      - name: Analyse with Julia
        if: steps.decrypt.outputs.have == '1'
        run: julia --project=lab/analysis lab/analysis/analyze.jl "$WORK/evidence" "$WORK/out"

      - name: Bundle + encrypt outputs to the archive public key
        if: steps.decrypt.outputs.have == '1'
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/reports-${GITHUB_SHA}.tar.zst.age"
          # bundle raw evidence + generated reports
          tar -C "$WORK" -cf - evidence out | zstd -q -19 | age -R lab/crypto/recipients.txt -o "$OUT"
          # guard: refuse to proceed if anything unencrypted sits next to the artifact
          test -f "$OUT" || { echo "encrypted output missing"; exit 1; }
          test "$(find "$RUNNER_TEMP" -maxdepth 1 \( -name '*.tar' -o -name '*.tar.zst' \) | wc -l)" -eq 0 \
            || { echo "unencrypted bundle present; aborting"; exit 1; }

      - name: Upload encrypted reports (only ciphertext leaves the runner)
        if: steps.decrypt.outputs.have == '1'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: reports-${{ github.sha }}
          path: ${{ runner.temp }}/reports-*.tar.zst.age
          retention-days: 90
          if-no-files-found: error

      - name: Scrub plaintext
        if: always()
        run: rm -rf "$RUNNER_TEMP/work" "$RUNNER_TEMP/blob.age" 2>/dev/null || true
