# Explicit migration Job; never part of the base kustomization.
# deploy-from-github.sh --migrate substitutes IMAGE and RELEASE_SHA after a
# PostgreSQL backup. Migrations are forward-only; downgrade = restore backup.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-RELEASE_SHORT
  namespace: homelab
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: homelab
    homelab.io/release: RELEASE_SHA
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        homelab.io/db-client: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: homelab-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: IMAGE
          args: ["migrate"]
          envFrom:
            - secretRef: {name: homelab-app}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
