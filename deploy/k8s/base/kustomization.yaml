apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab
labels:
  - pairs: {app.kubernetes.io/part-of: homelab}
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - networkpolicy.yaml
  - postgres-pvc.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - redis-pvc.yaml
  - redis-service.yaml
  - redis-statefulset.yaml
  - api-deployment.yaml
  - api-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - worker-deployment.yaml
  - dashboard-sa-rbac.yaml
  - dashboard-deployment.yaml
  - dashboard-service.yaml
