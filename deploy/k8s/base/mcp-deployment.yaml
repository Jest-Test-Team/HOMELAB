# Streamable HTTP MCP. Network-exposed only inside the cluster (ClusterIP),
# and every /mcp request needs the bearer token from the homelab-mcp secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels: {app.kubernetes.io/name: mcp}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: mcp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp}
    spec:
      serviceAccountName: homelab-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: homelab-mcp
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: RUST_LOG, value: info}
            - {name: BIND_ADDR, value: "0.0.0.0:8080"}
          envFrom:
            - secretRef: {name: homelab-mcp}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
