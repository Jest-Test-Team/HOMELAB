# Run from the Mac. Ubuntu is reached over Tailscale; Kali is reached over the
# isolated lab link via a ProxyJump through Ubuntu (Kali has no other route in).
[ubuntu_lab]
utm-homelab ansible_user=<vm-user>

[kali]
kali-red ansible_host=10.66.6.20 ansible_user=kali ansible_ssh_common_args='-o ProxyJump=<vm-user>@utm-homelab -o StrictHostKeyChecking=accept-new'

[lab:children]
ubuntu_lab
kali
