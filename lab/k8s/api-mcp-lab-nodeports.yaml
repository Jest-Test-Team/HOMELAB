# OPT-IN attack-lab surface. Apply ONLY when running the Kali lab:
#   kubectl apply -f lab/k8s/api-mcp-lab-nodeports.yaml
# and delete it when done. This exposes api and mcp on NodePorts so Kali can
# reach them at 10.66.6.10:30080 / :30081. Actual reachability is confined to
# the lab interface by the Ubuntu nftables rules (lab/ansible role ubuntu-lab);
# kube-proxy still binds them on 0.0.0.0, so the host firewall is what scopes it.
# Not part of the SHA-locked deploy; the core services stay ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: api-lab
  namespace: homelab
  labels: {app.kubernetes.io/name: api, homelab.io/lab-surface: "true"}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-lab
  namespace: homelab
  labels: {app.kubernetes.io/name: mcp, homelab.io/lab-surface: "true"}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: mcp}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30081}
---
# Allow the NodePort traffic (SNATed to the node IP) to reach api/mcp pods on
# 8080. Without this the default-deny-ingress policy would drop it. The home
# firewall, not this policy, limits WHO can reach the NodePort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-mcp-lab-ingress
  namespace: homelab
  labels: {homelab.io/lab-surface: "true"}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [api, mcp]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 8080}
