# Homelab lab-isolation pf anchor. Loaded by lab/macos/install-pf-anchor.sh.
# Defense in depth on the macOS host: the lab subnet (static, isolated L2) must
# never be sourced from or routed through the Mac. Guests talk to each other
# directly on the vmnet L2; these rules stop the Mac itself from bridging the
# lab to the home LAN or accepting lab traffic.
#
# LAB_SUBNET is substituted by the install script.
block drop quick from <LAB_SUBNET> to any
block drop quick from any to <LAB_SUBNET>
